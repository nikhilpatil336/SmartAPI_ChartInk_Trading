spring.application.name=local_to_smartapi

info.app.name=${spring.application.name}
info.app.version=@project.version@

broker.api.base-url=https://apiconnect.angelone.in
broker.api.timeout.connect=2000
broker.api.timeout.response=2000


angel.base-url=https://apiconnect.angelone.in
angel.client-local-ip=192.168.1.10
angel.client-public-ip=123.145.22.11
angel.client-mac-address=AA-BB-CC-DD-EE-FF
angel.source-id=WEB
angel.user-type=USER
angel.client-id=${ANGEL_CLIENT_ID}
angel.password=${ANGEL_PASSWORD}
angel.totp-code=${ANGEL_TOTP}
angel.private-key=${ANGEL_PRIVATE_KEY}

#myPC windows path
myapp.token-file-path=D:/1 percent growth trading/tokens.json
myapp.scripmaster-file-path=D:/1 percent growth trading/scripmaster.json
myapp.filtered-scripmaster-file-path=D:/1 percent growth trading/scrip_master_nse_eq.json
myapp.rms-balance-file-path=D:/1 percent growth trading/rmsbalance.json
myapp.scripmaster-fno-list-file-path=D:/1 percent growth trading/fno_stock_list.json
myapp.leverage-list-file-path=D:/1 percent growth trading/leverage_list.json
myapp.sl-orderstore-file-path=D:/1 percent growth trading/

