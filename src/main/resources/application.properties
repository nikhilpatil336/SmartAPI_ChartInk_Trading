# Requests are rejected if available balance is <= this value
myapp.balance-minimum-allowed=0

# Order is rejected if max purchasable quantity is <= this value
myapp.stock-buy-minimum-quantity-required=0

#0.98 = (1 + 0.5)%
myapp.profit-percentage-multiplier=1.005

#0.98 = (1 - 0.2)%
myapp.stoploss-percentage-multiplier=0.998

#1000 milis = 1 sec
myapp.order-book-retry-milliseconds=1000

#1 = 100%, 0.5 = 50% balance use
myapp.percent-balance-use=1

#after calculating the quantity for safety reduce this much quantity from final quantity
myapp.number-of-stocks-buy-less=0

#this value can be between 1 to 5
myapp.leverage-multiplier-to-use=3

myapp.fixed-quantity-flag=false
myapp.fixed-quantity=2

myapp.trading-window-enable=false
myapp.trading-window-start-time=07:00
myapp.trading-window-end-time=14:30
myapp.trading-window-time-zone=Asia/Kolkata

myapp.rms-auto-refresh-enable=true
myapp.rms-file-overwrite-enabled=true
myapp.rms-refresh-interval-minutes=30

myapp.scripmaster-only-fno-stocks=true
myapp.scripmaster-enable-fno-universe=true

myapp.leverage-enable=true
myapp.leverage-universe=true
myapp.leverage-exchange=NSE